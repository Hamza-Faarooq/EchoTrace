[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echotrace"
version = "0.1.0"
description = "Natural-language semantic search and temporal localization for environmental audio."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.14.0",
    "soundfile==0.13.1",
    "huggingface-hub==0.23.4",
    "transformers==4.42.4",
    "streamlit==1.43.2",
    "psutil==6.1.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
